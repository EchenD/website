# Enable gzip compression
gzip on;
gzip_vary on;
gzip_min_length 10240;
gzip_proxied expired no-cache no-store private auth;
gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/wasm application/octet-stream;
gzip_disable "MSIE [1-6]\.";

# Set correct MIME types for Unity files
types {
    application/octet-stream unityweb;
    application/wasm wasm;
    application/javascript js;
}

# Cache control for Unity files
location ~* \.(unityweb|wasm|js)$ {
    expires 1y;
    add_header Cache-Control "public, no-transform";
}

server {
    location ~ \.unityweb$ {
        gzip on;
        gzip_types application/octet-stream;
        add_header Content-Encoding gzip;
        add_header Content-Type application/octet-stream;
    }
}